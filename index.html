
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DineFlow - Restaurant Ordering</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8f6;color:#17231d;font-family:Arial,sans-serif}
header{background:#14251e;color:white;padding:22px 18px;border-radius:0 0 22px 22px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#72d6a0}
.table{font-size:12px;color:#c4d5ca;margin-top:5px}
.hero{padding:23px 18px}
.hero h1{font-size:27px;margin:0 0 8px}
.hero p{color:#718078;margin:0}
.search{margin:0 18px 18px;padding:14px;border:1px solid #e3e9e4;border-radius:12px;background:white;width:calc(100% - 36px);font-size:15px;outline:none}
.categories{display:flex;gap:9px;padding:0 18px 20px;overflow-x:auto}
.cat{border:1px solid #dce5de;background:white;padding:10px 17px;border-radius:25px;white-space:nowrap}
.cat.active{background:#173d2c;color:white;border-color:#173d2c}
.section{padding:0 18px}
.section h2{font-size:20px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding-bottom:110px}
.food{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 14px #17231d0b}
.foodpic{height:115px;display:flex;align-items:center;justify-content:center;font-size:58px;background:#edf4ed}
.foodinfo{padding:12px}
.foodinfo h3{font-size:15px;margin:0 0 6px}
.foodinfo p{font-size:11px;color:#78847d;margin:0 0 12px}
.price{font-weight:bold;color:#183d2b}
.add{background:#173d2c;color:white;border:0;border-radius:8px;padding:9px 13px;font-weight:bold}
.foodbottom{display:flex;align-items:center;justify-content:space-between}
.cartbar{position:fixed;bottom:12px;left:12px;right:12px;background:#173d2c;color:white;padding:15px 18px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 20px #0003}
.cartbar button{background:#76dda4;color:#14251e;border:0;padding:11px 16px;border-radius:9px;font-weight:bold}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end}
.drawer{background:white;width:100%;padding:22px;border-radius:22px 22px 0 0;max-height:80vh;overflow:auto}
.drawer h2{margin-top:0}
.cartitem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:13px 0}
.qty button{border:0;background:#e8f2eb;padding:7px 11px;border-radius:7px}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;margin:20px 0}
.checkout{width:100%;padding:15px;border:0;border-radius:10px;background:#173d2c;color:white;font-size:16px;font-weight:bold}
.close{float:right;border:0;background:#eee;padding:8px 12px;border-radius:8px}
footer{text-align:center;color:#88948c;padding:20px;font-size:12px}
</style>
</head>
<body>

<header>
 <div class="top">
  <div class="logo">Dine<span>Flow.</span></div>
  <div>🍽️ Restaurant</div>
 </div>
 <div class="table" id="tableLabel">SMART DINING EXPERIENCE · TABLE 01</div>
  
<a href="kitchen.html" style="color:#72d6a0;display:block;margin-top:12px;text-decoration:none;font-weight:bold">
  🍳 Open Kitchen Dashboard →
</a>

</header>

<div class="hero">
 <h1>Good food, good mood! 🍽️</h1>
 <p>Discover our delicious menu and order your favourites.</p>
</div>

<input class="search" id="search" placeholder="🔍 Search your favourite food..." oninput="render()">

<div class="categories" id="categories">
 <button class="cat active" onclick="filter('All',this)">All</button>
 <button class="cat" onclick="filter('Starters',this)">Starters</button>
 <button class="cat" onclick="filter('Main Course',this)">Main Course</button>
 <button class="cat" onclick="filter('Pizza',this)">Pizza</button>
 <button class="cat" onclick="filter('Drinks',this)">Drinks</button>
 <button class="cat" onclick="filter('Desserts',this)">Desserts</button>
</div>

<div class="section">
 <h2>Our Menu</h2>
 <div class="menu" id="menu"></div>
</div>

<footer>Powered by DineFlow · Enjoy your meal ❤️</footer>

<div class="cartbar">
 <div><b>🛒 My Cart</b><br><small id="count">0 items · ₹0</small></div>
 <button onclick="openCart()">View Cart →</button>
</div>
<div style="margin:20px 20px 160px;padding:16px;background:#e8f2eb;border-radius:14px;text-align:center;">
  <h3 style="color:#004b38;">📦 Track Your Order</h3>
  <button onclick="showOrderTracking()" style="background:#004b38;color:white;padding:13px 25px;border:0;border-radius:10px;font-size:16px;">
    Track My Order →
  </button>
  <div id="trackingBox" style="margin-top:15px;"></div>
</div>


<div class="overlay" id="overlay" onclick="if(event.target===this)closeCart()">
 <div class="drawer">
  <button class="close" onclick="closeCart()">✕ Close</button>
  <h2>Your Order 🛒</h2>
  <div id="cartitems"></div>
  <div class="total"><span>Total</span><span id="total">₹0</span></div>
  <button class="checkout" onclick="placeOrder()">Place Order</button>
 </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
const tableNo = params.get("table") || "01";

document.getElementById("tableLabel").innerText =
"SMART DINING EXPERIENCE · TABLE " + tableNo;
const foods=[
{id:1,name:"Paneer Tikka",price:220,cat:"Starters",emoji:"🍢",desc:"Smoky grilled paneer"},
{id:2,name:"Veg Spring Roll",price:150,cat:"Starters",emoji:"🥟",desc:"Crispy vegetable rolls"},
{id:3,name:"Butter Paneer",price:280,cat:"Main Course",emoji:"🍛",desc:"Rich creamy paneer curry"},
{id:4,name:"Veg Biryani",price:240,cat:"Main Course",emoji:"🍚",desc:"Aromatic basmati rice"},
{id:5,name:"Margherita Pizza",price:250,cat:"Pizza",emoji:"🍕",desc:"Cheese and fresh basil"},
{id:6,name:"Farmhouse Pizza",price:320,cat:"Pizza",emoji:"🍕",desc:"Loaded vegetable pizza"},
{id:7,name:"Cold Coffee",price:120,cat:"Drinks",emoji:"🥤",desc:"Chilled creamy coffee"},
{id:8,name:"Fresh Lime Soda",price:80,cat:"Drinks",emoji:"🍋",desc:"Refreshing lime drink"},
{id:9,name:"Chocolate Brownie",price:140,cat:"Desserts",emoji:"🍫",desc:"Warm chocolate brownie"},
{id:10,name:"Ice Cream",price:100,cat:"Desserts",emoji:"🍨",desc:"Delicious vanilla scoop"}
];
let cart={};
let category="All";

function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=foods.filter(f=>(category==="All"||f.cat===category)&&f.name.toLowerCase().includes(q));
document.getElementById('menu').innerHTML=list.map(f=>`
<div class="food">
 <div class="foodpic">${f.emoji}</div>
 <div class="foodinfo">
  <h3>${f.name}</h3>
  <p>${f.desc}</p>
  <div class="foodbottom">
   <span class="price">₹${f.price}</span>
   <button class="add" onclick="add(${f.id})">+ Add</button>
  </div>
 </div>
</div>`).join('');
}

function filter(c,btn){
category=c;
document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
render();
}

function add(id){
cart[id]=(cart[id]||0)+1;
update();
}

function change(id,n){
cart[id]+=n;
if(cart[id]<=0)delete cart[id];
update();
}

function update(){
let qty=Object.values(cart).reduce((a,b)=>a+b,0);
let sum=foods.reduce((a,f)=>a+f.price*(cart[f.id]||0),0);
document.getElementById('count').innerText=qty+' items · ₹'+sum;
document.getElementById('cartitems').innerHTML=Object.keys(cart).map(id=>{
let f=foods.find(x=>x.id==id);
return `<div class="cartitem">
<div><b>${f.name}</b><br>₹${f.price} × ${cart[id]}</div>
<div class="qty">
<button onclick="change(${id},-1)">−</button>
${cart[id]}
<button onclick="change(${id},1)">+</button>
</div></div>`;
}).join('')||'<p>Your cart is empty. Add some delicious food!</p>';
document.getElementById('total').innerText='₹'+sum;
}

function openCart(){
document.getElementById('overlay').style.display='flex';
}
function closeCart(){
document.getElementById('overlay').style.display='none';
}

function placeOrder(){
  if(!Object.keys(cart).length){
    alert('Please add food to your cart first!');
    return;
  }

  let total=foods.reduce(
    (a,f)=>a+f.price*(cart[f.id]||0),0
  );

  let newOrder={
    id:Date.now(),
    table:tableNo,
    items:foods.filter(f=>cart[f.id]).map(f=>({
      name:f.name,
      qty:cart[f.id]
    })),
    total:total,
    status:"New",
    time:new Date().toLocaleString()
  };

  let savedOrders=JSON.parse(
    localStorage.getItem("dineflow_orders")||"[]"
  );

  savedOrders.push(newOrder);
  localStorage.setItem(
    "dineflow_orders",
    JSON.stringify(savedOrders)
  );

  alert("Order successfully sent to Kitchen!");

  cart={};
  update();
  closeCart();
}




function showOrderTracking(){
  let box=document.getElementById("trackingBox");

  let orders=JSON.parse(
    localStorage.getItem("dineflow_orders") || "[]"
  );

  if(!orders.length){
    box.innerHTML="<p>No order found.</p>";
    return;
  }

  let order=orders[orders.length-1];

  let steps=["New","Preparing","Ready","Completed"];
  let current=steps.indexOf(order.status);
let eta = order.status==="New" ? "15–20 minutes" :
          order.status==="Preparing" ? "10–15 minutes" :
          order.status==="Ready" ? "Ready to serve" :
          "Completed";
  box.innerHTML=`
    <div style="background:white;padding:20px;border-radius:15px;text-align:left;">
      <h2>Order #${order.id}</h2>
      <p>Table: ${order.table}</p>
      <p>Total: ₹${order.total}</p>
     <p><b>Estimated Time:</b> ${eta}</p> <hr>
      ${steps.map((s,i)=>`
        <div style="padding:12px 0;color:${i<current?'#00845c':i===current?'#006047':'#aaa'};font-weight:${i===current?'bold':'normal'};">
          ${i<current?'✓':i===current?'●':'○'} ${s}
          ${i===current?'<small> — Current Status</small>':''}
        </div>
      `).join("")}
      
      <small>Last checked: ${new Date().toLocaleTimeString()}</small>
    </div>
  `;
}
setInterval(function(){
  let box=document.getElementById("trackingBox");
  if(box && box.innerHTML.trim()!==""){
    showOrderTracking();
  }
},3000);

render();
update();
</script>
</body>
</html>
