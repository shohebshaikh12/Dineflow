<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DineFlow Kitchen Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f2;color:#17231d;font-family:Arial,sans-serif;padding:20px}
h1{font-size:25px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat,.order{background:white;padding:20px;border-radius:18px;margin-bottom:15px}
.stat strong{font-size:30px;display:block}
.stat span{color:#718078}
.filters{display:flex;gap:9px;overflow-x:auto;margin:20px 0}
.filters button{padding:12px 18px;border:1px solid #ddd;border-radius:30px;background:white;white-space:nowrap}
.filters button.active{background:#004b38;color:white}
.order h2{font-size:20px}
.order p{font-size:16px}
.status{float:right;background:#e8f2eb;padding:9px;border-radius:20px;font-size:13px}
.action{width:100%;padding:15px;border:0;border-radius:12px;background:#004b38;color:white;font-size:16px;font-weight:bold;margin-top:12px}
.empty{text-align:center;color:#888;padding:30px}
</style>
</head>
<body>

<h1>🍳 DineFlow Kitchen Dashboard</h1>

<div class="stats">
<div class="stat"><strong id="new">0</strong><span>New Orders</span></div>
<div class="stat"><strong id="preparing">0</strong><span>Preparing</span></div>
<div class="stat"><strong id="ready">0</strong><span>Ready</span></div>
<div class="stat"><strong id="completed">0</strong><span>Completed</span></div>
</div>

<div class="filters">
<button class="active" onclick="filter('All',this)">All Orders</button>
<button onclick="filter('New',this)">New</button>
<button onclick="filter('Preparing',this)">Preparing</button>
<button onclick="filter('Ready',this)">Ready</button>
<button onclick="filter('Completed',this)">Completed</button>
</div>

<div id="orders"></div>

<script>
let selected="All";

function getOrders(){
 return JSON.parse(localStorage.getItem("dineflow_orders")||"[]");
}

function saveOrders(data){
 localStorage.setItem("dineflow_orders",JSON.stringify(data));
 render();
}

function filter(status,btn){
 selected=status;
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 render();
}

function nextStatus(id){
 let orders=getOrders();
 let order=orders.find(o=>String(o.id)===String(id));
 if(!order)return;

 if(order.status==="New")order.status="Preparing";
 else if(order.status==="Preparing")order.status="Ready";
 else if(order.status==="Ready")order.status="Completed";

 saveOrders(orders);
}

function render(){
 let data=getOrders();

 ["New","Preparing","Ready","Completed"].forEach(s=>{
 document.getElementById(s.toLowerCase()).innerText=
 data.filter(o=>o.status===s).length;
 });

 let list=data.filter(o=>selected==="All"||o.status===selected);
 let box=document.getElementById("orders");

 if(!list.length){
 box.innerHTML='<div class="empty">No orders found 🍽️</div>';
 return;
 }

 box.innerHTML=list.slice().reverse().map(o=>{
 let action=o.status==="New"?"Accept & Prepare":
 o.status==="Preparing"?"Mark Ready":
 o.status==="Ready"?"Mark Completed":"";

 return `
 <div class="order">
 <span class="status">${o.status}</span>
 <h2>Order #${o.id}</h2>
 <p>Table ${o.table}</p>
 <hr>
 ${o.items.map(i=>`<p>${i.name} × ${i.qty}</p>`).join("")}
 <h3>Total: ₹${o.total}</h3>
 <small>${o.time}</small>
 ${action?`<button class="action" onclick="nextStatus('${o.id}')">${action}</button>`:""}
 </div>`;
 }).join("");
}

render();
setInterval(render,2000);
</script>

</body>
</html>
